name: Manual WebXR / IWER diagnostic (not routine CI)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness-unit:
    name: Validate declarative harness configuration (no browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test-support/webxr-test/harness-options.test.mjs
