name: SR1O one-command owner-PC native comparison safety gate (NO REAL ENGINE)
on:
  pull_request:
    branches: [integration/single-chat-validation-2026-10-30]
    paths:
      - 'visual-qa/sr1o-owner-pc-native-comparison-once.ps1'
      - 'tests/sr1o_owner_pc_native_comparison.test.mjs'
      - 'tests/sr1o_owner_pc_native_comparison_parser_windows.ps1'
      - '.github/workflows/sr1o-native-comparison-launcher.yml'
  push:
    branches: [integration/single-chat-validation-2026-10-30]
    paths:
      - 'visual-qa/sr1o-owner-pc-native-comparison-once.ps1'
      - 'tests/sr1o_owner_pc_native_comparison.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-native-run:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strict job IDs, source-only publisher and separate Unreal execution
        shell: pwsh
        run: node --test tests/sr1o_owner_pc_native_comparison.test.mjs
      - name: Parse exact owner script on Windows PowerShell 5.1 and PowerShell 7 WITHOUT execution
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1o_owner_pc_native_comparison_parser_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 parser failed' }
          & (Get-Command pwsh.exe -ErrorAction Stop).Source -NoProfile -NonInteractive -File tests/sr1o_owner_pc_native_comparison_parser_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 parser failed' }
      - name: CI evidence limitation
        shell: pwsh
        if: always()
        run: |
          'Hosted Windows CI only parses/validates scripts, does not launch installed owner-PC UE5.8, generate native images or prove RTX5060 device/PID.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
