name: SR1C Godot 4.7.2 source scene parser (NO GPU evidence)

on:
  push:
    branches: [integration/single-chat-validation-2026-10-30]
    paths:
      - 'visual-qa/godot-local-clinical/**'
      - 'native-godot/**'
      - 'tests/sr2_godot_native_full_app_foundation.test.mjs'
      - 'visual-qa/sr1c-godot-background-capture.gd'
      - 'visual-qa/sr1c-godot-clinic-overview.gd'
      - 'visual-qa/sr1d-godot-case-workflow.gd'
      - 'visual-qa/sr1d-godot-case-workflow-smoke.gd'
      - 'visual-qa/sr1d-export-native-cases.mjs'
      - 'visual-qa/sr1c-build-godot-local.ps1'
      - 'visual-qa/sr1-local-kliniklab-export.mjs'
      - '.github/workflows/sr1c-godot-4-7-native-parse.yml'
  pull_request:
    branches: [integration/single-chat-validation-2026-10-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-source-parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare original FDI16 without claiming a native GPU render
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-source-project/source"
          cp visual-qa/godot-local-clinical/project.godot visual-qa/godot-local-clinical/main.tscn visual-qa/godot-local-clinical/main.gd "$RUNNER_TEMP/godot-source-project/"
          cp visual-qa/sr1c-godot-background-capture.gd visual-qa/sr1c-godot-clinic-overview.gd visual-qa/sr1d-godot-case-workflow.gd visual-qa/sr1d-godot-case-workflow-smoke.gd "$RUNNER_TEMP/godot-source-project/"
          node visual-qa/sr1-local-kliniklab-export.mjs "--expected-sha=$GITHUB_SHA" "--output=$RUNNER_TEMP/source-obj"
          cp "$RUNNER_TEMP/source-obj/"* "$RUNNER_TEMP/godot-source-project/source/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/godot-source-project/source/expected-sha.txt"
          printf '%s\n' 'clinic-cases' > "$RUNNER_TEMP/godot-source-project/source/scene-mode.txt"
          node visual-qa/sr1d-export-native-cases.mjs "--source-dir=$GITHUB_WORKSPACE" "--expected-sha=$GITHUB_SHA" "--output=$RUNNER_TEMP/godot-source-project/source/kliniklab-native-cases.json"
          echo "$RUNNER_TEMP" > "$RUNNER_TEMP/godot-source-project/source/capture-path.txt"
      - name: Download official 4.7.2 Linux editor
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import and parse same source pinned GDScript through Godot 4.7.2 (HEADLESS, NOT RENDERED)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/godot-source-project" --editor --import --quit > "$RUNNER_TEMP/godot-parse.log" 2>&1 || { cat "$RUNNER_TEMP/godot-parse.log"; exit 1; }
          cat "$RUNNER_TEMP/godot-parse.log"
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Parser Error" "$RUNNER_TEMP/godot-parse.log"; then
            echo "Godot source parser errors: FAIL"; exit 1
          fi
      - name: Parse new autonomous Godot SceneTree background runner (CHECK ONLY; no GPU render)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/godot-source-project" --check-only --script res://sr1c-godot-background-capture.gd > "$RUNNER_TEMP/background-parse.log" 2>&1 || { cat "$RUNNER_TEMP/background-parse.log"; exit 1; }
          cat "$RUNNER_TEMP/background-parse.log"
      - name: Parse native clinic workspace script (CHECK ONLY; no GPU render)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/godot-source-project" --check-only --script res://sr1c-godot-clinic-overview.gd > "$RUNNER_TEMP/clinic-parse.log" 2>&1 || { cat "$RUNNER_TEMP/clinic-parse.log"; exit 1; }
          cat "$RUNNER_TEMP/clinic-parse.log"
      - name: Parse native case/station workflow (not rendering)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/godot-source-project" --check-only --script res://sr1d-godot-case-workflow.gd > "$RUNNER_TEMP/workflow-parse.log" 2>&1 || { cat "$RUNNER_TEMP/workflow-parse.log"; exit 1; }
          cat "$RUNNER_TEMP/workflow-parse.log"
      - name: Run actual Godot native case/station logic in HEADLESS CI (NOT GPU)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/godot-source-project" --script res://sr1d-godot-case-workflow-smoke.gd > "$RUNNER_TEMP/workflow-runtime.log" 2>&1 || { cat "$RUNNER_TEMP/workflow-runtime.log"; exit 1; }
          cat "$RUNNER_TEMP/workflow-runtime.log"
          grep -F 'SR1D_GODOT_CASE_STATION_LOGIC_PASSED' "$RUNNER_TEMP/workflow-runtime.log"
      - name: Build independent source-exact interactive Godot app project (no GPU)
        run: |
          set -euo pipefail
          node --test tests/sr2_godot_native_full_app_foundation.test.mjs
          node native-godot/build-app.mjs "--source-dir=$GITHUB_WORKSPACE" "--expected-sha=$GITHUB_SHA" "--output=$RUNNER_TEMP/native-kliniklab-app"
          test -f "$RUNNER_TEMP/native-kliniklab-app/app.tscn"
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/app-content.json"
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/fdi16-volume-field.bin"
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/fdi16-volume-field-manifest.json"
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/editable-case-volumes.json"
          for tooth in 16 36 11 26 48 46; do
            test -s "$RUNNER_TEMP/native-kliniklab-app/source/fdi${tooth}-volume-field.bin"
            test -s "$RUNNER_TEMP/native-kliniklab-app/source/fdi${tooth}-volume-field-manifest.json"
          done
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/clinical-pathways.json"
      - name: Parse full-app Godot scene and interactive app GDScript through real Godot 4.7.2
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --editor --import --quit > "$RUNNER_TEMP/native-app-import.log" 2>&1 || { cat "$RUNNER_TEMP/native-app-import.log"; exit 1; }
          cat "$RUNNER_TEMP/native-app-import.log"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --check-only --script res://app.gd > "$RUNNER_TEMP/native-app-parse.log" 2>&1 || { cat "$RUNNER_TEMP/native-app-parse.log"; exit 1; }
          cat "$RUNNER_TEMP/native-app-parse.log"
          if grep -Ei 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' "$RUNNER_TEMP/native-app-import.log" "$RUNNER_TEMP/native-app-parse.log"; then
            echo 'Godot native app parser failed'; exit 1
          fi
      - name: Execute source-backed native application interaction and local persistence in Godot 4.7.2 (HEADLESS, not GPU)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --script res://smoke.gd > "$RUNNER_TEMP/native-app-smoke.log" 2>&1 || { cat "$RUNNER_TEMP/native-app-smoke.log"; exit 1; }
          cat "$RUNNER_TEMP/native-app-smoke.log"
          grep -F "SR2_NATIVE_FULL_APP_FOUNDATION_LOGIC_PASS" "$RUNNER_TEMP/native-app-smoke.log"
      - name: Native source-pinned interactive FDI16 volume regression (HEADLESS, not GPU)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --check-only --script res://volume-cut.gd > "$RUNNER_TEMP/volume-parse.log" 2>&1 || { cat "$RUNNER_TEMP/volume-parse.log"; exit 1; }
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --script res://volume-cut-smoke.gd > "$RUNNER_TEMP/volume-smoke.log" 2>&1 || { cat "$RUNNER_TEMP/volume-smoke.log"; exit 1; }
          cat "$RUNNER_TEMP/volume-smoke.log"
          grep -F "SR3_NATIVE_FDI16_VOLUME_LOGIC_PASS" "$RUNNER_TEMP/volume-smoke.log"
      - name: Six original clinical cases have separate source-verified editable native 3D volumes
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --check-only --script res://multi-case-volume-smoke.gd > "$RUNNER_TEMP/multivolume-parse.log" 2>&1 || { cat "$RUNNER_TEMP/multivolume-parse.log"; exit 1; }
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --script res://multi-case-volume-smoke.gd > "$RUNNER_TEMP/multivolume-runtime.log" 2>&1 || { cat "$RUNNER_TEMP/multivolume-runtime.log"; exit 1; }
          cat "$RUNNER_TEMP/multivolume-runtime.log"
          grep -F "SR9_NATIVE_ALL_SIX_CASE_EDITABLE_VOLUMES_PASS" "$RUNNER_TEMP/multivolume-runtime.log"
      - name: Source-derived 32-tooth atlas native mesh test (HEADLESS, no GPU/clinical acceptance)
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/atlas/atlas.json"
          test "$(find "$RUNNER_TEMP/native-kliniklab-app/source/atlas" -name 'fdi*.bin' | wc -l)" -eq 32
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --check-only --script res://atlas-viewer.gd > "$RUNNER_TEMP/atlas-parse.log" 2>&1 || { cat "$RUNNER_TEMP/atlas-parse.log"; exit 1; }
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --script res://atlas-smoke.gd > "$RUNNER_TEMP/atlas-test.log" 2>&1 || { cat "$RUNNER_TEMP/atlas-test.log"; exit 1; }
          cat "$RUNNER_TEMP/atlas-test.log"
          grep -F "SR6_NATIVE_SOURCE_32_ATLAS_LOGIC_PASS" "$RUNNER_TEMP/atlas-test.log"
      - name: Native bounded STL/OBJ scan viewer test (HEADLESS, no GPU)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --check-only --script res://scan-viewer.gd > "$RUNNER_TEMP/scan-parse.log" 2>&1 || { cat "$RUNNER_TEMP/scan-parse.log"; exit 1; }
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/native-kliniklab-app" --script res://scan-smoke.gd > "$RUNNER_TEMP/scan-smoke.log" 2>&1 || { cat "$RUNNER_TEMP/scan-smoke.log"; exit 1; }
          cat "$RUNNER_TEMP/scan-smoke.log"
          grep -F "SR7_NATIVE_LOCAL_STL_OBJ_SCAN_LOGIC_PASS" "$RUNNER_TEMP/scan-smoke.log"
      - name: Package source-exact runnable Godot native app (no Windows GPU acceptance)
        if: success()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/native-kliniklab-app/native-build-manifest.json"
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/clinical-pathways.json"
          test -f "$RUNNER_TEMP/native-kliniklab-app/source/fdi16-volume-field.bin"
          rm -rf "$RUNNER_TEMP/native-kliniklab-app/.godot"
      - name: Upload standalone native Godot project for download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KlinikLab-Native-Project-${{ github.sha }}
          path: ${{ runner.temp }}/native-kliniklab-app/
          retention-days: 30
          if-no-files-found: error
      - name: Explicit evidence limits
        if: always()
        run: |
          echo 'Godot 4.7.2 parsed source only. Headless mode provides NO visible native teeth, physical RTX GPU utilization, real viewport screenshot, or Quest proof.' >> "$GITHUB_STEP_SUMMARY"
