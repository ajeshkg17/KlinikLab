name: SR1C Godot PC watcher syntax and bounded contract (NO NATIVE RENDER)

on:
  push:
    branches: [integration/single-chat-validation-2026-10-30]
    paths:
      - 'visual-qa/godot-worker.mjs'
      - 'visual-qa/godot-next-job-admission.mjs'
      - 'tests/sr1g_godot_watcher_env_readiness.test.mjs'
      - 'tests/sr1g_godot_launcher_env_windows.ps1'
      - 'visual-qa/godot-job07-forensics.mjs'
      - 'tests/sr1e_job07_forensic_recovery.test.mjs'
      - 'tests/sr1e_watcher_stderr_windows.ps1'
      - 'visual-qa/godot-single-instance.mjs'
      - 'visual-qa/install-godot-pc-watcher.ps1'
      - 'tests/sr1f_godot_watcher_installer_ps_parser_windows.ps1'
      - 'tests/sr1d_godot_watcher_lock.test.mjs'
      - 'visual-qa/godot-job-core.mjs'
      - 'visual-qa/sr1c-capture-godot-pc.ps1'
      - 'visual-qa/sr1c-capture-godot-background-pc.ps1'
      - 'visual-qa/sr1n-godot-capture-completion.ps1'
      - 'tests/sr1n_godot_native_capture_completion_windows.ps1'
      - 'visual-qa/sr1n-publish-original-job08-images.ps1'
      - 'visual-qa/sr1p-job08-publication-gate.ps1'
      - 'tests/sr1p_job08_ledger_reconciliation_windows.ps1'
      - 'tests/sr1p_q_job08_unity_native_workflow.test.mjs'
      - 'tests/sr1n_godot_native_capture_race.test.mjs'
      - 'visual-qa/sr1c-private-desktop.ps1'
      - 'visual-qa/sr1c-dxgi-luid.cs'
      - 'visual-qa/sr1c-pdh-filter.ps1'
      - 'visual-qa/sr1x-capture-native-exported-app-pc.ps1'
      - 'visual-qa/sr16-ownerpc-readonly-diagnostics.ps1'
      - 'visual-qa/sr26-lease-raw-timestamp.ps1'
      - 'tests/sr26_lease_raw_timestamp_windows.ps1'
      - 'tests/sr16_ownerpc_readonly_diagnostics.test.mjs'
      - 'visual-qa/sr1d-prepare-godot-cases.ps1'
      - 'visual-qa/sr1d-export-native-cases.mjs'
      - 'visual-qa/sr1d-godot-case-workflow.gd'
      - 'tests/sr1d_godot_cases.test.mjs'
      - 'visual-qa/sr1c-godot-clinic-overview.gd'
      - 'tests/sr1c_pdh_invalid_rows_windows.ps1'
      - 'tests/sr1c_windows_dxgi_pdh_smoke.ps1'
      - 'visual-qa/sr1c-capture-godot-background-pc.ps1'
      - 'visual-qa/sr1c-godot-background-capture.gd'
      - 'visual-qa/sr1c-build-godot-local.ps1'
      - 'visual-qa/jobs/godot-current.json'
      - 'tests/sr1c_godot_pc_watcher.test.mjs'
      - 'tests/sr1c_job05_pdh_orbit.test.mjs'
      - 'tests/sr1c_windows_private_desktop_bom.test.mjs'
      - 'tests/sr1c_windows_private_desktop_smoke.ps1'
      - 'visual-qa/godot-json.mjs'
      - 'tests/sr1c_windows_psmodulepath.test.mjs'
      - 'visual-qa/godot-powershell-environment.mjs'
      - '.github/workflows/sr1c-godot-pc-watcher-syntax.yml'
  pull_request:
    branches: [integration/single-chat-validation-2026-10-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source-syntax:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript source and bounded Godot job schema
        shell: pwsh
        run: |
          node --check visual-qa/godot-worker.mjs
          node --check visual-qa/godot-next-job-admission.mjs
          node --test tests/sr1g_godot_watcher_env_readiness.test.mjs
          node --test tests/sr1n_godot_native_capture_race.test.mjs
          node --test tests/sr1p_q_job08_unity_native_workflow.test.mjs
          node --test tests/sr16_ownerpc_readonly_diagnostics.test.mjs
          node --check visual-qa/godot-job07-forensics.mjs
          node --test tests/sr1e_job07_forensic_recovery.test.mjs
          node --check visual-qa/godot-single-instance.mjs
          node --test tests/sr1d_godot_watcher_lock.test.mjs
          node --check visual-qa/godot-job-core.mjs
          node --test tests/sr1c_godot_pc_watcher.test.mjs
          node --test tests/sr1c_job05_pdh_orbit.test.mjs tests/sr1c_job06_clinic.test.mjs tests/sr1d_godot_cases.test.mjs
          node --test tests/sr1c_windows_private_desktop_bom.test.mjs
      - name: Dual-engine installer syntax gate (real Windows PowerShell 5.1 AND PowerShell 7; no execution)
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1f_godot_watcher_installer_ps_parser_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 installer parser failed' }
          & (Get-Command pwsh.exe -ErrorAction Stop).Source -NoLogo -NoProfile -NonInteractive -File tests/sr1f_godot_watcher_installer_ps_parser_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 installer parser failed' }
      - name: Reconcile original published job08 with absent local ledger (WinPS5.1 + PS7; zero real jobs)
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1p_job08_ledger_reconciliation_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WinPS5.1 original job08 ledger reconciliation regression failed' }
          & (Get-Command pwsh.exe -ErrorAction Stop).Source -NoProfile -NonInteractive -File tests/sr1p_job08_ledger_reconciliation_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell7 original job08 ledger reconciliation regression failed' }
      - name: SR26 verify raw Node Z lease timestamp and 54ms correlation on real WinPS 5.1 and PS7 (pure read-only synthetic)
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr26_lease_raw_timestamp_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WinPS 5.1 raw UTC lease timestamp regression failed' }
          & (Get-Command pwsh.exe -ErrorAction Stop).Source -NoLogo -NoProfile -NonInteractive -File tests/sr26_lease_raw_timestamp_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 raw UTC lease timestamp regression failed' }
      - name: Prove actual Windows PowerShell 5.1 scheduled launcher passes Godot EXE to child Node
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1g_godot_launcher_env_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Godot executable inheritance contract failed' }
      - name: Prove delayed 42s Godot report cannot race 34s PDH collector (real WinPS 5.1 and PowerShell 7)
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1n_godot_native_capture_completion_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WinPS5.1 delayed native capture producer-consumer regression failed' }
          & (Get-Command pwsh.exe -ErrorAction Stop).Source -NoLogo -NoProfile -NonInteractive -File tests/sr1n_godot_native_capture_completion_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell7 delayed native capture producer-consumer regression failed' }
      - name: Prove native Windows PowerShell watcher stderr stays separated and capture can finish
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1e_watcher_stderr_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native stderr-safe watcher regression failed' }
      - name: Simulate inherited pwsh 7 PSModulePath and prove Windows PowerShell 5.1 SHA256 -File works
        shell: pwsh
        run: |
          $env:PSModulePath = "$env:ProgramFiles\PowerShell\7\Modules;$env:PSModulePath"
          node --test tests/sr1c_windows_psmodulepath.test.mjs
      - name: Parse PowerShell scripts without executing on hosted runner
        shell: pwsh
        run: |
          $paths = @(
            'visual-qa/sr1c-build-godot-local.ps1',
            'visual-qa/install-godot-pc-watcher.ps1',
            'tests/sr1g_godot_launcher_env_windows.ps1',
            'tests/sr1e_watcher_stderr_windows.ps1',
            'visual-qa/sr1c-capture-godot-pc.ps1',
            'visual-qa/sr1c-capture-godot-background-pc.ps1',
            'visual-qa/sr1n-godot-capture-completion.ps1',
            'tests/sr1n_godot_native_capture_completion_windows.ps1',
            'visual-qa/sr1n-publish-original-job08-images.ps1',
            'visual-qa/sr1p-job08-publication-gate.ps1',
            'tests/sr1p_job08_ledger_reconciliation_windows.ps1',
            'visual-qa/sr1c-private-desktop.ps1',
            'visual-qa/sr1c-pdh-filter.ps1',
            'visual-qa/sr1x-capture-native-exported-app-pc.ps1',
            'visual-qa/sr16-ownerpc-readonly-diagnostics.ps1',
            'visual-qa/sr26-lease-raw-timestamp.ps1',
            'tests/sr26_lease_raw_timestamp_windows.ps1',
            'visual-qa/sr1d-prepare-godot-cases.ps1',
            'tests/sr1c_pdh_invalid_rows_windows.ps1',
            'visual-qa/sr1c-capture-godot-background-pc.ps1'
          )
          foreach ($p in $paths) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$p : $($_.Message)" }
              throw "PowerShell parse failure: $p"
            }
            Write-Host "PowerShell syntax accepted: $p"
          }
      - name: Compile real WinPS private desktop Win32 P/Invoke helper (NO desktop switch/process launch)
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '. .\visual-qa\sr1c-private-desktop.ps1; if (-not ("KlinikLab.PrivateDesktop" -as [type])) { throw "Win32 P/Invoke helper did not compile" }; Write-Host "Private desktop PInvoke class compiled"'
          if ($LASTEXITCODE -ne 0) { throw 'Private desktop helper compilation failed' }
      - name: Try REAL WinSta0 desktop creation using minimal rights, never switch or launch Godot
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1c_windows_private_desktop_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows private desktop CreateDesktopW smoke failure' }
      - name: Real Windows typed DXGI adapter LUID and persistent PDH 1Hz smoke (no Godot)
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1c_windows_dxgi_pdh_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows DXGI adapter LUID or PDH persistent query regression failed' }
      - name: Synthetic invalid GPU counter status, NaN, PID/LUID and duplicate-time regression
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/sr1c_pdh_invalid_rows_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows Godot PDH invalid-row filtering failed' }
      - name: Evidence boundary
        shell: pwsh
        if: always()
        run: |
          'Hosted Windows workflow performs source syntax/schema checks only. It does not start Godot, capture native pixels, or access owner RTX 5060.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
